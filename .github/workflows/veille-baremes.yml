# Veille réglementaire mensuelle des barèmes officiels (détection seulement).
# Ouvre une issue GitHub en cas d'écart — ne commite et ne modifie JAMAIS rien.
# Secret requis : ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions).
name: Veille barèmes officiels

on:
  schedule:
    - cron: '0 6 2 * *'   # le 2 de chaque mois à 06h00 UTC (après les entrées en vigueur au 1er)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installer les dépendances (SDK Anthropic pour le recoupement web)
        run: npm ci --omit=dev

      - name: Lancer la veille
        id: veille
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          node automation/veille-baremes.js
          echo "code=$?" >> "$GITHUB_OUTPUT"
          rapport=$(ls -t automation/rapports-veille/*.md 2>/dev/null | head -1)
          echo "rapport=$rapport" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Ouvrir une issue si écart détecté
        if: steps.veille.outputs.code != '0'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const rapport = '${{ steps.veille.outputs.rapport }}';
            const code = '${{ steps.veille.outputs.code }}';
            const corps = rapport && fs.existsSync(rapport)
              ? fs.readFileSync(rapport, 'utf8')
              : `La veille s'est terminée avec le code ${code} sans produire de rapport. Consulter les logs du workflow.`;
            const date = new Date().toISOString().slice(0, 10);
            const titre = code === '2'
              ? `💥 Veille barèmes ${date} : erreur technique`
              : `⚠️ Veille barèmes ${date} : écart détecté — vérification humaine requise`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: titre,
              body: corps + '\n\n---\n*Issue ouverte automatiquement par le workflow `veille-baremes.yml`. Aucun fichier du dépôt n\'a été modifié.*',
              labels: ['baremes'],
            });
